<script charset="utf-8" src="data/unified_catalog.js"></script>
<script>
(function () {
  "use strict";
  if (window.__JT_LOCKED__) return;
  var main = document.getElementById("main");
  var IS_CLOUD_HOST = /\.github\.io$/i.test(window.location.hostname || "");
  var JT_GATE_HASH = "6e95ff3e55611d24803014d9de77b401f191f198f9372577e58f9aa2e51771d3";
  var GATE_KEY_BYTES = new Uint8Array(32);
  for (var ki = 0; ki < 32; ki++) {
    GATE_KEY_BYTES[ki] = parseInt(JT_GATE_HASH.slice(ki * 2, ki * 2 + 2), 16);
  }

  function decodeEncPayload(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) {
      out[i] = bin.charCodeAt(i) ^ GATE_KEY_BYTES[i & 31] ^ ((i * 31) & 0xff);
    }
    if (typeof DecompressionStream !== "undefined") {
      var ds = new DecompressionStream("gzip");
      var stream = new Blob([out]).stream().pipeThrough(ds);
      return new Response(stream).text().then(function (txt) { return JSON.parse(txt); });
    }
    return Promise.resolve(JSON.parse(new TextDecoder("utf-8").decode(out)));
  }

  var SHARDS = {};
  var SHARD_ENC_WAIT = {};
  var SHARD_PENDING = {};
  window.__CATALOG_SHARD__ = function (shardId, map) {
    SHARDS[shardId] = map || {};
  };
  window.__CATALOG_SHARD_ENC__ = function (shardId, b64) {
    SHARD_ENC_WAIT[shardId] = decodeEncPayload(b64).then(function (map) {
      SHARDS[shardId] = map || {};
      delete SHARD_ENC_WAIT[shardId];
      return SHARDS[shardId];
    }).catch(function () {
      SHARDS[shardId] = {};
      delete SHARD_ENC_WAIT[shardId];
      return {};
    });
  };

  function startApp(C) {
    if (!C) {
      main.innerHTML = '<div class="empty">未找到 data/unified_catalog.js，请运行「生成会话总目录.py」或双击「更新并打开会话总目录.cmd」。</div>';
      return;
    }

  var cockpitLink = document.getElementById("cockpit-link");
  if (IS_CLOUD_HOST && cockpitLink) {
    cockpitLink.href = "https://aikingtai-ctrl.github.io/jintai-global-cockpit/";
  }

  var S = C.sessions || [];
  var ALL_GROUPS = C.groups || [];
  var G = {};
  var GORDER = ALL_GROUPS.map(function (g) { G[g.id] = g.name; return g.id; });
  var PLAT_LABEL = { agy: "Antigravity", codex: "Codex", claude: "Claude" };
  var WEEK = "日一二三四五六";
  var COCKPIT_API = "http://127.0.0.1:18899";

  // ---------- 分片按需加载器（file:/// 零 CORS / 云端自动解密，秒级载入）
  function loadShard(shardId, cb) {
    if (!shardId) { cb({}); return; }
    if (SHARDS[shardId]) { cb(SHARDS[shardId]); return; }
    if (SHARD_PENDING[shardId]) { SHARD_PENDING[shardId].push(cb); return; }
    SHARD_PENDING[shardId] = [cb];
    var sc = document.createElement("script");
    sc.charset = "utf-8";
    sc.src = "data/shards/" + encodeURIComponent(shardId) + ".js?v=" + C.generated;
    function finish() {
      var cbs = SHARD_PENDING[shardId] || [];
      delete SHARD_PENDING[shardId];
      var data = SHARDS[shardId] || {};
      cbs.forEach(function (fn) { fn(data); });
    }
    sc.onload = sc.onerror = function () {
      sc.remove();
      if (SHARD_ENC_WAIT[shardId]) {
        SHARD_ENC_WAIT[shardId].then(finish, finish);
      } else {
        finish();
      }
    };
    document.head.appendChild(sc);
  }
  function getFullMsgs(s, cb) {
    if (s._msgs) { cb(s._msgs); return; }
    loadShard(s.sh, function (map) {
      s._msgs = map[s.id] || [];
      cb(s._msgs);
    });
  }

  // ---------- 小工具
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function sh(sec) { return new Date(sec * 1000 + 8 * 3600000); }
  function dayKey(sec) { return sh(sec).toISOString().slice(0, 10); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtDay(key) {
    var d = new Date(key + "T00:00:00Z");
    return (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日 周" + WEEK[d.getUTCDay()];
  }
  function fmtShort(sec) {
    if (!sec) return "";
    var d = sh(sec);
    return pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " + pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
  }
  var TODAY = dayKey(Date.now() / 1000);
  function daysAgo(n) { return dayKey(Date.now() / 1000 - n * 86400); }
  function rel(key) { if (key === TODAY) return "今天"; if (key === daysAgo(1)) return "昨天"; return fmtDay(key); }
  function baseName(p) { var i = p.lastIndexOf("\\"); return i >= 0 ? p.slice(i + 1) : p; }
  function dirName(p) { var i = p.lastIndexOf("\\"); return i >= 0 ? p.slice(0, i) : ""; }
  function fileUrl(p) {
    return "file:///" + p.split("\\").map(encodeURIComponent).join("/").replace(/^([A-Za-z])%3A/, "$1:");
  }
  function toast(t) {
    var el = document.getElementById("toast");
    el.textContent = t;
    el.classList.add("show");
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }
  function copy(t, label) {
    function fb() {
      var ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast(label || "已复制"); }
      catch (e) { toast("复制失败，请手动选中复制"); }
      ta.remove();
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(function () { toast(label || "已复制"); }, fb);
    } else {
      fb();
    }
  }
  function openViaCockpitOrFallback(payload, fallbackFn) {
    if (IS_CLOUD_HOST) {
      fallbackFn();
      return;
    }
    fetch(COCKPIT_API + "/api/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (data && data.ok) {
        if (payload.mode === "reveal") toast("已定位并选中文件");
        else if (payload.mode === "obsidian") toast("已在 Obsidian 打开归档");
        else toast("已打开");
      } else {
        fallbackFn();
      }
    }).catch(fallbackFn);
  }

  var VIEWABLE = /\.(html?|pdf|png|jpe?g|gif|webp|svg|mp4|webm|mp3|wav|txt|md|csv|json)$/i;
  function fileTag(p, isDir) {
    if (isDir) return "目录";
    var m = p.match(/\.([A-Za-z0-9]+)$/);
    return m ? m[1].toUpperCase() : "文件";
  }

  // ---------- 预处理索引
  var BY_ID = {};
  S.forEach(function (s) {
    BY_ID[s.id] = s;
    s.tl = (s.t + "\n" + (s.pt || []).join("\n")).toLowerCase();
    s.hay = (s.qs || s.tl).toLowerCase();
    s.dset = {};
    (s.d || []).forEach(function (k) { s.dset[k] = 1; });
  });

  // ---------- 持久化状态
  var fs = 20;
  var dark = false;
  var st = { p: "all", v: "group", r: 0, g: "", q: "", hideSched: true };
  var folded = {};
  var groupLimit = {};
  var listLimit = 50;

  function setFs(v) {
    fs = Math.max(14, Math.min(34, v));
    document.documentElement.style.setProperty("--fs", fs + "pt");
  }
  function setDark(v) {
    dark = !!v;
    document.body.classList.toggle("dark", dark);
    document.getElementById("theme-btn").textContent = dark ? "浅色高对比" : "深色护眼";
  }
  function save() {
    try {
      localStorage.setItem("ccd-catalog-v2", JSON.stringify({
        p: st.p, v: st.v, r: st.r, fs: fs, dark: dark, hideSched: st.hideSched
      }));
      localStorage.setItem("ccd-catalog-fold-v2", JSON.stringify(folded));
    } catch (e) {}
  }
  try {
    var sv = JSON.parse(localStorage.getItem("ccd-catalog-v2") || "{}");
    if (sv.p) st.p = sv.p;
    if (sv.v) st.v = sv.v;
    if (sv.r != null) st.r = sv.r;
    if (sv.fs) setFs(sv.fs);
    if (sv.dark) setDark(sv.dark);
    if (sv.hideSched != null) st.hideSched = !!sv.hideSched;
  } catch (e) {}
  try { folded = JSON.parse(localStorage.getItem("ccd-catalog-fold-v2") || "{}"); } catch (e) {}

  function inRange(s) {
    if (!st.r) return true;
    var cut = daysAgo(st.r - 1);
    for (var i = s.d.length - 1; i >= 0; i--) if (s.d[i] >= cut) return true;
    return dayKey(s.a) >= cut;
  }
  function baseFiltered(skipPlat) {
    return S.filter(function (s) {
      if (st.hideSched && s.sch) return false;
      if (!skipPlat && st.p !== "all" && s.p !== st.p) return false;
      if (!inRange(s)) return false;
      if (!skipPlat && st.g && s.g !== st.g) return false;
      return true;
    });
  }

  // ---------- 卡片渲染
  function chips(s) {
    var h = '<span class="chip ' + esc(s.p) + '">' + esc(PLAT_LABEL[s.p] || s.p) + "</span>";
    if (s.star) h += '<span class="chip warn">置顶</span>';
    h += '<span class="chip g">' + esc(G[s.g] || "未分组") + "</span>";
    if (s.st === "cleaned") h += '<span class="chip warn">正文已归档</span>';
    if (s.st === "none") h += '<span class="chip warn">仅剩标题</span>';
    if (s.arc) h += '<span class="chip">已归档</span>';
    return h;
  }

  function primaryAction(s) {
    if (s.p === "claude") {
      if (s.cur) {
        return '<a class="btn subtle" href="claude://claude.ai/epitaxy/' + esc(s.rid) + '" title="在 Claude 桌面端打开此会话">在 Claude 打开</a>';
      }
      return "";
    }
    if (s.p === "codex") {
      return '<button type="button" class="btn subtle" data-copy="codex resume ' + esc(s.rid) + '" title="复制终端续聊命令">复制续聊命令</button>';
    }
    return "";
  }

  function extraPlatformBtns(s) {
    var h = primaryAction(s);
    if (s.obs) {
      h += '<button type="button" class="btn subtle" data-obs="' + esc(s.id) + '" title="在 Obsidian 打开脱敏归档">Obsidian 归档</button>';
    }
    if (s.cwd) {
      h += '<button type="button" class="btn subtle" data-cwd="' + esc(s.id) + '" title="打开所在工作目录：' + esc(s.cwd) + '">工作目录</button>';
    }
    return h;
  }

  function fileRows(s, limit) {
    if (!s.f || !s.f.length) return "";
    var h = '<div class="fl">';
    s.f.slice(0, limit).forEach(function (f) {
      var fp = f[0], isDir = f[1];
      h += '<div class="f">' +
        '<span class="chip">' + esc(fileTag(fp, isDir)) + '</span>' +
        '<span class="fn">' + esc(baseName(fp) || fp) + '</span>' +
        '<span class="fp">' + esc(dirName(fp)) + '</span>' +
        '<button type="button" class="btn" data-openpath="' + esc(fp) + '" data-isdir="' + (isDir ? 1 : 0) + '">打开</button>' +
        (!isDir ? '<button type="button" class="btn" data-reveal="' + esc(fp) + '">定位文件夹</button>' : "") +
        '<button type="button" class="btn" data-copy="' + esc(fp) + '">复制路径</button>' +
        "</div>";
    });
    if (s.f.length > limit) {
      h += '<div class="f"><button type="button" class="btn" data-morefiles="' + esc(s.id) + '">还有 ' + (s.f.length - limit) + " 个文件，全部显示</button></div>";
    }
    return h + "</div>";
  }

  function card(s, terms, compact) {
    var h = '<div class="card p-' + esc(s.p) + (terms ? " hit" : "") + (compact ? " compact" : "") + '" data-id="' + esc(s.id) + '">';
    h += '<div class="h"><span class="dt">' + esc(fmtShort(s.a || s.c)) + '</span><span class="tt">' + hl(s.t, terms) + "</span>" + chips(s) + "</div>";
    if (s.pt && s.pt.length && terms) {
      var hitOld = s.pt.filter(function (t) { return terms.some(function (q) { return t.toLowerCase().indexOf(q) >= 0; }); });
      if (hitOld.length) h += '<div class="ln old">曾用标题：' + hl(hitOld.join(" / "), terms) + "</div>";
    }
    var cl = compact ? " clamp" : "";
    if (terms) {
      h += snippets(s, terms);
    } else {
      if (s.fr) h += '<div class="ln' + cl + '" title="点一下展开"><b>你：</b>' + esc(s.fr) + "</div>";
      if (s.lr) h += '<div class="ln' + cl + '" title="点一下展开"><b>结果：</b>' + esc(s.lr) + "</div>";
      if (s.mem && s.mem.length) {
        s.mem.slice(compact ? -1 : -2).forEach(function (m) {
          h += '<div class="mem' + cl + '" title="点一下展开">记忆：' + esc(m) + "</div>";
        });
      }
    }
    if (!compact) h += fileRows(s, 3);
    h += '<div class="acts">' +
      '<button type="button" class="btn pri" data-conv="' + esc(s.id) + '">看全文</button>' +
      extraPlatformBtns(s) +
      (compact && s.f.length ? '<button type="button" class="btn" data-files="1">交付文件 ' + s.f.length + " 个</button>" : "") +
      '<button type="button" class="btn" data-copy="' + esc(s.t) + '">复制标题</button>' +
      '<span class="meta">提问 ' + s.n[0] + " · 回复 " + s.n[1] + " · 创建 " + esc(fmtShort(s.c)) + "</span>" +
      "</div>";
    if (compact && s.f.length) h += '<div class="fbox" hidden></div>';
    return h + '<div class="conv" hidden></div></div>';
  }

  // ---------- 搜索与高亮
  function hl(text, terms) {
    var t = esc(text);
    if (!terms || !terms.length) return t;
    terms.forEach(function (q) {
      var eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (eq) t = t.replace(new RegExp("(" + eq + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
    });
    return t;
  }

  function snippets(s, terms) {
    var out = [];
    var msgs = s._msgs;
    if (msgs && msgs.length) {
      var q0 = terms[0];
      var order = msgs.filter(function (x) { return x[0] === 0; }).concat(msgs.filter(function (x) { return x[0] === 1; }));
      for (var i = 0; i < order.length && out.length < 3; i++) {
        var x = order[i];
        if (x[2].toLowerCase().indexOf(q0) < 0) continue;
        var txt = x[2].replace(/```[^\n]*/g, " ").replace(/\*\*|__/g, "").replace(/\s+/g, " ");
        var k = txt.toLowerCase().indexOf(q0);
        if (k < 0) continue;
        var a = Math.max(0, k - 45), b = Math.min(txt.length, k + q0.length + 95);
        var piece = (a > 0 ? "…" : "") + txt.slice(a, b) + (b < txt.length ? "…" : "");
        out.push('<div class="snip"><span class="who">' + (x[0] === 0 ? "你" : PLAT_LABEL[s.p]) + "</span>" + hl(piece, terms) + "</div>");
      }
    }
    if (!out.length) {
      var hay = s.qs || "";
      for (var j = 0; j < terms.length && out.length < 2; j++) {
        var idx = hay.toLowerCase().indexOf(terms[j]);
        if (idx >= 0) {
          var sa = Math.max(0, idx - 45), sb = Math.min(hay.length, idx + terms[j].length + 100);
          var seg = (sa > 0 ? "…" : "") + hay.slice(sa, sb) + (sb < hay.length ? "…" : "");
          out.push('<div class="snip"><span class="who">命中上下文</span>' + hl(seg, terms) + "</div>");
        }
      }
    }
    if (!out.length) {
      if (s.fr) out.push('<div class="ln"><b>你：</b>' + hl(s.fr, terms) + "</div>");
      if (s.lr) out.push('<div class="ln"><b>结果：</b>' + hl(s.lr, terms) + "</div>");
    }
    return out.join("");
  }

  function parseQuery(raw) {
    // 支持空格 AND，以及 | 并集 OR
    var branches = raw.toLowerCase().split("|").map(function (b) {
      return b.trim().split(/\s+/).filter(Boolean);
    }).filter(function (b) { return b.length > 0; });
    var flat = [];
    branches.forEach(function (b) { b.forEach(function (t) { if (flat.indexOf(t) < 0) flat.push(t); }); });
    return { branches: branches, flat: flat };
  }

  function search(list, parsed, deepShards) {
    var res = [];
    list.forEach(function (s) {
      var fullBody = "";
      if (deepShards && s._msgs && s._msgs.length) {
        fullBody = s._msgs.map(function (m) { return m[2]; }).join("\n").toLowerCase();
      }
      var sc = 0;
      var matched = false;
      for (var b = 0; b < parsed.branches.length; b++) {
        var terms = parsed.branches[b];
        var ok = true;
        var bScore = 0;
        for (var i = 0; i < terms.length; i++) {
          var q = terms[i];
          var inHay = s.hay.indexOf(q) >= 0;
          var inFull = deepShards && fullBody.indexOf(q) >= 0;
          if (!inHay && !inFull) { ok = false; break; }
          if (s.tl.indexOf(q) >= 0) bScore += 100;
          if ((s.fr || "").toLowerCase().indexOf(q) >= 0) bScore += 25;
          bScore += inHay ? 5 : 2;
        }
        if (ok) { matched = true; if (bScore > sc) sc = bScore; }
      }
      if (matched) res.push([sc, s]);
    });
    res.sort(function (x, y) { return y[0] - x[0] || y[1].a - x[1].a; });
    return res.map(function (x) { return x[1]; });
  }

  // ---------- 视图渲染
  var GROUP_PAGE = 25;
  var LIST_PAGE = 50;
  var deepSearchDone = false;
  var deepSearchLoading = false;

  function triggerDeepSearch() {
    if (deepSearchDone || deepSearchLoading) return;
    deepSearchLoading = true;
    var shardIds = [];
    S.forEach(function (s) { if (s.sh && !SHARDS[s.sh] && shardIds.indexOf(s.sh) < 0) shardIds.push(s.sh); });
    if (!shardIds.length) {
      S.forEach(function (s) { if (!s._msgs && SHARDS[s.sh]) s._msgs = SHARDS[s.sh][s.id] || []; });
      deepSearchDone = true;
      deepSearchLoading = false;
      return;
    }
    var idx = 0;
    function pump() {
      var batch = shardIds.slice(idx, idx + 3);
      idx += 3;
      if (!batch.length) {
        S.forEach(function (s) { if (!s._msgs && SHARDS[s.sh]) s._msgs = SHARDS[s.sh][s.id] || []; });
        deepSearchDone = true;
        deepSearchLoading = false;
        if (st.q.trim()) render();
        return;
      }
      var left = batch.length;
      batch.forEach(function (sid) {
        loadShard(sid, function () {
          left--;
          if (left <= 0) pump();
        });
      });
    }
    pump();
  }

  function viewSearch(list) {
    if (!deepSearchDone && !deepSearchLoading) triggerDeepSearch();
    var parsed = parseQuery(st.q);
    var res = search(list, parsed, deepSearchDone);
    var shown = res.slice(0, listLimit);
    var deepTag = deepSearchDone
      ? '<span class="cnt" id="deep-search-state" style="margin-left:auto;">已覆盖全部完整正文</span>'
      : '<span class="cnt" id="deep-search-state" style="margin-left:auto;">正在后台扩展全部完整正文…</span>';
    var h = '<div class="sect"><h2 class="plain">搜索「' + esc(st.q) + '」<span class="cnt">找到 ' + res.length + " 个会话</span>" + deepTag + "</h2></div>";
    if (!res.length) return h + '<div class="empty">' + (deepSearchDone ? "没有找到匹配的会话，请换个词或放宽上方「平台 / 时间 / 文件夹」筛选。" : "正在后台检索全部分片正文…") + "</div>";
    h += shown.map(function (s) { return card(s, parsed.flat, false); }).join("");
    if (res.length > listLimit) {
      h += '<div class="more"><button type="button" class="btn" data-morelist="1">显示更多（还有 ' + (res.length - listLimit) + " 个会话）</button></div>";

  function viewRecent(list) {
    var sorted = list.slice().sort(function (x, y) { return (y.star - x.star) || (y.a - x.a); });

  function section(gid, name, arr, autoFoldOld) {

  function viewGroup(list) {

    var openCount = 0;

  function lastOn(s, k) { return s.a || s.c; }

    var h = "";
    showKeys.forEach(function (k) {

      h += '<div class="sect day"><h2 class="plain">' + esc(rel(k)) + (rel(k) !== fmtDay(k) ? "（" + esc(fmtDay(k)) + "）" : "") + '<span class="cnt">' + arr.length + " 个会话</span></h2>";

    }

  var FILE_KIND = [

        fileRows({ f: entry.fs, id: s.id }, 99) +

        '<div class="conv" hidden></div></div>';

      h += '<div class="more"><button type="button" class="btn" data-morelist="1">展开更多（还有 ' + (cards.length - listLimit) + " 场含交付文件）</button></div>";

  // ---------- Markdown 全文渲染
  function md(src) {
    var lines = src.replace(/\r/g, "").split("\n"), out = [], i = 0;
    function inl(s) {
      return s.split(/(`[^`\n]+`)/).map(function (p, j) {
        if (j % 2) return "<code>" + esc(p.slice(1, -1)) + "</code>";
        return esc(p)
          .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      }).join("");
    }
    function isBlock(l) { return /^\s*(```|#{1,6}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(l); }
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l)) {
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        var t = "<table>";
        rows.forEach(function (r, k) {
          if (/^\s*\|?\s*:?-{2,}/.test(r)) return;
          var cells = r.trim().replace(/^\||\|$/g, "").split("|");
          t += "<tr>" + cells.map(function (c) { return (k === 0 ? "<th>" : "<td>") + inl(c.trim()) + (k === 0 ? "</th>" : "</td>"); }).join("") + "</tr>";
        });
        out.push(t + "</table>"); continue;
      }
      var hm = l.match(/^\s*(#{1,6})\s+(.*)$/);
      if (hm) { var lv = Math.min(hm[1].length + 2, 6); out.push("<h" + lv + ">" + inl(hm[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
        var ordered = /^\s*\d/.test(l), items = [];
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
        out.push((ordered ? "<ol>" : "<ul>") + items.map(function (x) { return "<li>" + inl(x) + "</li>"; }).join("") + (ordered ? "</ol>" : "</ul>")); continue;
      }
      if (/^\s*>/.test(l)) {
        var qb = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) qb.push(lines[i++].replace(/^\s*>\s?/, ""));
        out.push("<blockquote>" + qb.map(inl).join("<br>") + "</blockquote>"); continue;
      }
      if (!l.trim()) { i++; continue; }
      var para = [l]; i++;
      while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) para.push(lines[i++]);
      out.push("<p>" + para.map(inl).join("<br>") + "</p>");
    }
    return out.join("");
  }

  function markTerms(el, terms) {
    if (!terms.length) return;
    var re = new RegExp("(" + terms.map(function (q) { return q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "gi");
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      if (!re.test(n.nodeValue)) return;
      re.lastIndex = 0;
      var span = document.createElement("span");
      span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
      n.parentNode.replaceChild(span, n);
    });
  }

  function renderConvBody(box, s, msgs, day, onlyUser) {
    var filteredMsgs = day ? msgs.filter(function (x) { return dayKey(x[1]) === day; }) : msgs;
    if (day && !filteredMsgs.length) filteredMsgs = msgs;
    if (onlyUser) filteredMsgs = filteredMsgs.filter(function (x) { return x[0] === 0; });

    var h = '<div class="conv-bar">' +
      '<button type="button" class="btn' + (!onlyUser ? " pri" : "") + '" data-convfilter="all">全部消息</button>' +
      '<button type="button" class="btn' + (onlyUser ? " pri" : "") + '" data-convfilter="user">只看我说</button>' +
      '<button type="button" class="btn" data-copymd="1">复制全文 Markdown</button>' +
      '<span class="meta" style="color:var(--text-muted)">共 ' + filteredMsgs.length + " 条</span>" +
      "</div>";
    if (!filteredMsgs.length) {
      h += '<div class="empty" style="margin:16px 0">这个会话暂无可展示的文字记录。</div>';
    } else {
      var whoAsst = PLAT_LABEL[s.p] || "AI";
      filteredMsgs.forEach(function (x) {
        h += '<div class="msg ' + (x[0] === 0 ? "u" : "a") + '">' +
          '<div class="who">' + (x[0] === 0 ? "你" : esc(whoAsst)) + '<span class="ts">' + esc(fmtShort(x[1])) + "</span></div>" +
          '<div class="md">' + (x[0] === 0 ? "<p>" + esc(x[2]).replace(/\n/g, "<br>") + "</p>" : md(x[2])) + "</div></div>";
      });
      h += '<div class="more"><button type="button" class="btn" data-conv="' + esc(s.id) + '"' + (day ? ' data-day="' + day + '"' : "") + ' data-bottom="1">收起</button></div>';
    }
    box.innerHTML = h;
    box.dataset.onlyUser = onlyUser ? "1" : "0";
    box.dataset.day = day || "";
    var parsed = parseQuery(st.q);
    if (parsed.flat.length) {
      markTerms(box, parsed.flat);
      var first = box.querySelector("mark");
      if (first) first.scrollIntoView({ block: "center" });
    }
  }

  function toggleConv(wrap, day, fromBottom) {
    var box = wrap.querySelector(".conv"), btn = wrap.querySelector("[data-conv]"), id = wrap.dataset.id;
    if (!box.hidden) {
      box.hidden = true; box.innerHTML = "";

    }
    var s = BY_ID[id];

    box.innerHTML = '<div class="empty" style="margin:12px 0">正在加载对话分片……</div>';

    btn.textContent = "收起";
    getFullMsgs(s, function (msgs) {
      renderConvBody(box, s, msgs, day, false);
    });

  // ---------- 联动更新顶部筛选条与文件夹列表
  function refreshGroupSelect() {
    var gsel = document.getElementById("gsel");
    var visible = baseFiltered(true).filter(function (s) { return st.p === "all" || s.p === st.p; });
    var cnt = {};
    visible.forEach(function (s) { cnt[s.g] = (cnt[s.g] || 0) + 1; });
    var opts = ALL_GROUPS.filter(function (g) {

    gsel.innerHTML = '<option value="">全部文件夹（' + visible.length + '）</option>' +
      opts.map(function (g) {
        return '<option value="' + esc(g.id) + '">' + esc(g.name) + "（" + cnt[g.id] + "）</option>";
      }).join("");
    if (st.g && cnt[st.g]) gsel.value = st.g;
    else { st.g = ""; gsel.value = ""; }

  function updateControlsUI() {

    var pc = { all: platPool.length, agy: 0, codex: 0, claude: 0 };

  var HELP = '<details class="help"><summary>怎么用（点开看）</summary><ul>' +
    "<li><b>三端统一搜索</b>：同时搜索 Antigravity、Codex 与 Claude 全部会话标题、你的提问、完整回复与交付文件路径；空格表“同时包含”，<code>|</code> 表“任一包含”。输入搜索词时，页面先瞬时出摘要结果，并在后台自动扩展扫描全部分片全文。</li>" +
    "<li><b>按需看全文</b>：页面首屏仅加载轻量目录，点「看全文」才毫秒级读取对应月度分片，大库也绝不卡顿。</li>" +

    }
    if (t.dataset.reveal) {
      var rp = t.dataset.reveal;
      openViaCockpitOrFallback({ path: rp, mode: "reveal" }, function () {
        copy(rp, "已复制文件路径");
      });
      return;
    }
    if (t.dataset.obs) {
      var so = BY_ID[t.dataset.obs];
      if (!so || !so.obs) return;
      openViaCockpitOrFallback({ path: "", mode: "obsidian", obsidian_rel: so.obs }, function () {
        window.location.href = "obsidian://open?vault=" + encodeURIComponent("AI永久记忆") + "&file=" + encodeURIComponent(so.obs);
      });
      return;
    }
    if (t.dataset.cwd) {
      var sc = BY_ID[t.dataset.cwd];
      if (!sc || !sc.cwd) return;
      openViaCockpitOrFallback({ path: sc.cwd, mode: "open" }, function () {
        copy(sc.cwd, "已复制工作目录路径");
      });
      return;
    }
    if (t.dataset.convfilter) {
      var cbox = t.closest(".conv"), wrapEl = t.closest("[data-id]");
      var sItem = BY_ID[wrapEl.dataset.id];
      if (sItem && sItem._msgs) {
        renderConvBody(cbox, sItem, sItem._msgs, cbox.dataset.day || "", t.dataset.convfilter === "user");
      }
      return;
    }
    if (t.dataset.copymd) {
      var wrapMd = t.closest("[data-id]");
      var sMd = BY_ID[wrapMd.dataset.id];
      if (sMd && sMd._msgs) {
        var mdOut = ["# " + sMd.t, ""];
        sMd._msgs.forEach(function (m) {
          mdOut.push("### " + (m[0] === 0 ? "你" : PLAT_LABEL[sMd.p]) + " (" + fmtShort(m[1]) + ")", "", m[2], "");
        });
        copy(mdOut.join("\n"), "已复制整段 Markdown 对话");
      }
      return;
    }
    if (t.dataset.conv) { toggleConv(t.closest("[data-id]"), t.dataset.day, !!t.dataset.bottom); return; }
    if (t.dataset.fk != null) { fk = +t.dataset.fk; render(); return; }
    if (t.tagName === "H2" && t.parentNode.dataset.g) {
      var g = t.parentNode.dataset.g;
      var curFold = t.parentNode.classList.contains("fold");
      folded[g] = !curFold;
      t.parentNode.classList.toggle("fold", !curFold);
      save();
    }
  };

  // ---------- 顶部实时统计
  var bp = C.stats.by_plat || {};
  var schedCnt = C.stats.scheduled || 0;
  var humanCnt = Math.max(0, (C.stats.total || 0) - schedCnt);
  document.getElementById("stat").textContent =
    (IS_CLOUD_HOST ? "云端同步版 · " : "") +
    "共 " + C.stats.total + " 个会话（人工 " + humanCnt + " · 定时 " + schedCnt +
    " · AGY " + (bp.agy || 0) + " / Codex " + (bp.codex || 0) + " / Claude " + (bp.claude || 0) +
    "）· 更新于 " + fmtShort(C.generated);

  // ---------- Hash 直达参数（#q=...&p=agy|codex|claude&v=group|recent|day|files）
  location.hash.slice(1).split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("="), k = i >= 0 ? kv.slice(0, i) : kv, v = i >= 0 ? kv.slice(i + 1) : "";
    try { v = decodeURIComponent(v); } catch (e) {}
    if (k === "q" && v) { q.value = v; st.q = v.trim(); }
    if (k === "p" && /^(all|agy|codex|claude)$/.test(v)) st.p = v;
    if (k === "v" && /^(group|recent|day|files)$/.test(v)) st.v = v;
  });

  render();
  if (!IS_CLOUD_HOST) q.focus();

  // ---------- 每 5 分钟自动探测版本更新
  var upd = document.getElementById("upd");
  upd.onclick = function () { location.reload(); };
  function checkUpdate() {
    var sc = document.createElement("script");
    sc.src = "data/version.js?t=" + Date.now();
    sc.onload = sc.onerror = function () {
      sc.remove();
      if (window.CATALOG_VERSION > C.generated) {
        upd.textContent = "目录已更新（" + fmtShort(window.CATALOG_VERSION) + "），点这里刷新看最新内容";
        upd.hidden = false;
      }
    };
    document.head.appendChild(sc);
  }
  setInterval(checkUpdate, 5 * 60 * 1000);
  } // end startApp

  if (window.UNIFIED_CATALOG) {
    startApp(window.UNIFIED_CATALOG);
  } else if (typeof window.UNIFIED_CATALOG_ENC === "string" && window.UNIFIED_CATALOG_ENC.length > 0) {
    decodeEncPayload(window.UNIFIED_CATALOG_ENC).then(function (obj) {
      window.UNIFIED_CATALOG = obj;
      window.UNIFIED_CATALOG_ENC = "";
      startApp(obj);
    }).catch(function () {
      main.innerHTML = '<div class="empty">云端密文解码失败，请强制刷新页面或重新输入密码。</div>';
    });
  } else {
    startApp(null);
  }
})();
</script>
</body>
</html>
