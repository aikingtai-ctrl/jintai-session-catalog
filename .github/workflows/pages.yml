name: Deploy Jintai Session Catalog to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            cnt=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            case "$cnt" in ''|*[!0-9]*) cnt=0 ;; esac
            echo "Attempt ${i}: github-pages artifacts visible=${cnt}"
            if [ "$cnt" -ge 1 ]; then
              sleep 2
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Artifact metadata not yet visible via REST API after 36s; proceeding to deploy-pages anyway"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
